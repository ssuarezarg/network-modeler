# GitLab CE — VM-GIT (Azure)
#
# Hosts the netconfig-mirror repository. Private VM, no public IP: TLS uses a
# certificate you provide (internal CA or DNS-01 Let's Encrypt), NOT the omnibus
# HTTP-01 Let's Encrypt integration, which cannot work without inbound 80 from
# the internet.
#
# All bind mounts live under ${GITLAB_DATA_ROOT}, which MUST be an Azure managed
# data disk. See README.md §1 — the Azure ephemeral disk at /mnt loses everything
# on deallocation.
#
# Usage:  cp .env.example .env && edit .env && docker compose up -d

services:
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_VERSION}
    container_name: gitlab
    restart: always
    hostname: ${GITLAB_FQDN}

    environment:
      # NOTE: never put the root password here. Anything in `environment` is
      # visible to any user who can run `docker inspect`. First-boot password is
      # generated into /etc/gitlab/initial_root_password — see README.md §4.
      GITLAB_OMNIBUS_CONFIG: |
        ## The port belongs in external_url whenever it is not 443: GitLab bakes
        ## this value into every clone URL and post-login redirect it hands out.
        external_url 'https://${GITLAB_FQDN}:${GITLAB_HTTPS_PORT}'

        ## Pin nginx's INTERNAL port. Omnibus otherwise derives it from
        ## external_url, so a non-standard port there would make nginx listen on
        ## 8443 inside the container and the 8443:443 mapping below would no
        ## longer match anything. Pinning it decouples host port from URL port.
        nginx['listen_port'] = 443
        nginx['listen_https'] = true

        ## TLS — certificate provided by us, mounted read-only at /etc/gitlab/ssl
        letsencrypt['enable'] = false
        nginx['redirect_http_to_https'] = true
        nginx['ssl_certificate'] = "/etc/gitlab/ssl/${GITLAB_FQDN}.crt"
        nginx['ssl_certificate_key'] = "/etc/gitlab/ssl/${GITLAB_FQDN}.key"

        ## SSH — the host sshd owns port 22 on the VM, so git+ssh uses 2222.
        ## This value must match the published port below or every clone URL
        ## GitLab hands out will be wrong.
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT}

        ## Resource trimming — none of this is used by a config-mirror repo,
        ## and together it saves well over 1 GB of RAM.
        prometheus_monitoring['enable'] = false
        registry['enable'] = false
        gitlab_kas['enable'] = false
        puma['worker_processes'] = ${PUMA_WORKERS}
        sidekiq['max_concurrency'] = ${SIDEKIQ_CONCURRENCY}
        postgresql['shared_buffers'] = "${PG_SHARED_BUFFERS}"

        ## Outbound email is not configured. Left explicitly off so Sidekiq does
        ## not accumulate failing delivery jobs.
        gitlab_rails['smtp_enable'] = false
        gitlab_rails['gitlab_email_enabled'] = false

        ## Backups: retention only. The backup itself is driven from the host by
        ## scripts/backup.sh, so it can be scheduled and monitored like any other
        ## job on the VM.
        gitlab_rails['backup_keep_time'] = ${BACKUP_KEEP_SECONDS}

        gitlab_rails['time_zone'] = '${TZ}'

    ports:
      # Bind to the VNet private address, not 0.0.0.0. The NSG is the outer
      # control; this is the inner one. Defaults to 0.0.0.0 only so a first
      # bring-up works before you know the address.
      #
      # Host ports are non-standard because this VM already runs NetBox on
      # 80/443. Container-side stays 443/80 (see nginx['listen_port'] above).
      - '${BIND_ADDR:-0.0.0.0}:${GITLAB_HTTPS_PORT}:443'
      - '${BIND_ADDR:-0.0.0.0}:${GITLAB_HTTP_PORT}:80'
      - '${BIND_ADDR:-0.0.0.0}:${GITLAB_SSH_PORT}:22'

    volumes:
      - ${GITLAB_DATA_ROOT}/config:/etc/gitlab
      - ${GITLAB_DATA_ROOT}/logs:/var/log/gitlab
      - ${GITLAB_DATA_ROOT}/data:/var/opt/gitlab
      # Backups on their own mount so they can be moved to a separate disk or
      # synced to Blob Storage without touching the live data volume.
      - ${GITLAB_BACKUP_ROOT}:/var/opt/gitlab/backups
      # Certificate and key, read-only.
      - ${GITLAB_SSL_DIR}:/etc/gitlab/ssl:ro

    shm_size: '512m'

    # GitLab is extremely chatty. Without rotation these logs will fill the data
    # disk and take the instance down with them.
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

    # Stated explicitly rather than relying on the image's HEALTHCHECK, so the
    # generous start_period is guaranteed to apply: first-boot reconfiguration
    # takes several minutes and would otherwise be reported as unhealthy.
    healthcheck:
      test: ['CMD-SHELL', '/opt/gitlab/bin/gitlab-healthcheck --fail --max-time 10']
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 10m
